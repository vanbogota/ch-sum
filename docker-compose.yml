services:
  ghostwriter:
    # Prebuilt by GitHub Actions (.github/workflows/deploy.yml). IMAGE_TAG pins a commit; default latest.
    # `docker compose up -d --build` still builds locally from the Dockerfile.
    image: ghcr.io/vanbogota/ch-sum:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets
      - ./persona:/app/persona   # writable: export-examples writes persona/examples.md
    # MCP connector port, reachable only from this machine (Caddy / a tunnel publishes it).
    ports:
      - "127.0.0.1:8765:8765"
    # Lets the container reach services published on the host (e.g. LiteLLM on :4000)
    # as http://host.docker.internal:4000, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Alternative: join the LiteLLM compose network and use http://litellm:4000
    # networks: [default, litellm]
    # First run (interactive Telegram login):
    #   docker compose run --rm ghostwriter login

  # HTTPS for the MCP connector: `docker compose --profile https up -d`
  # Needs MCP_DOMAIN in .env and ports 80/443 open on the server.
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [ghostwriter]

volumes:
  caddy_data:

